# 组合包：装一次就得到「企微通道 + 通知 + / 命令」。
#
# 缺凭证时**三行一起停用**（一个开关管整条链路），所以装完没配好不会让 profile 起不来：
#
#   export WECOM_NOTIFY_BOT_ID=...
#   export WECOM_NOTIFY_BOT_SECRET=...
#   export WECOM_NOTIFY_TARGET=chatid或userid
#
# 想直接写死凭证 / 改默认值，在自己 profile 的 cordis.patch.yml 里按 id 覆盖。
# 注意两点：
#   1. 补丁整块替换 config，覆盖时要写全需要的键；
#   2. 本层的 disabled 会继续生效（补丁不写 disabled 就沿用），
#      所以不靠环境变量启用时，**三行都要显式写 disabled: false**。
#
#   - id: im-wecom
#     disabled: false
#     config:
#       botId: 'xxx'
#       secret: 'yyy'
#   - id: notify
#     disabled: false
#     config:
#       channel: wecom
#       target: 'chatid或userid'
#   - id: im-commands
#     disabled: false
#
# 行序有意义：`im`（接缝）→ `im-wecom`（通道）→ 功能。命令功能在挂载时就要在通道上
# 订阅消息，订阅不到会直接报错——所以通道那行必须排在它前面。
- insert:
    - id: im
      name: '@lijcoder/dsh-im'

    - id: im-wecom
      name: '@lijcoder/dsh-im-wecom'
      disabled: !!js "!(process.env.WECOM_NOTIFY_BOT_ID && process.env.WECOM_NOTIFY_BOT_SECRET && process.env.WECOM_NOTIFY_TARGET)"
      config:
        botId: !!js process.env.WECOM_NOTIFY_BOT_ID
        secret: !!js process.env.WECOM_NOTIFY_BOT_SECRET

    - id: notify
      name: '@lijcoder/dsh-notify'
      disabled: !!js "!(process.env.WECOM_NOTIFY_BOT_ID && process.env.WECOM_NOTIFY_BOT_SECRET && process.env.WECOM_NOTIFY_TARGET)"
      config:
        channel: wecom
        target: !!js process.env.WECOM_NOTIFY_TARGET

    - id: im-commands
      name: '@lijcoder/dsh-im-commands'
      disabled: !!js "!(process.env.WECOM_NOTIFY_BOT_ID && process.env.WECOM_NOTIFY_BOT_SECRET && process.env.WECOM_NOTIFY_TARGET)"
      config:
        channel: wecom
