# @lijcoder/dsh-im-commands 的 bundle 层：挂上 `/` 命令功能。
#
# 没有必填配置，所以默认启用。但**必须已经装了某个通道包**：命令功能在挂载时就要在
# 通道上订阅消息，订阅不到会直接报错（这是刻意的——静默不响应比报错难查得多）。
#
#   export DSH_IM_CHANNEL=wecom     # 可省略；装了多个通道时必填
- insert:
    - id: im-commands
      name: '@lijcoder/dsh-im-commands'
      config:
        channel: !!js process.env.DSH_IM_CHANNEL
